name = "multiplicative_basis_deformations"
version = "0.1.0"
defaultTargets = ["MultiplicativeBasisDeformations"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "c55e6e786f49471c72fbddbec5415808896aec1e"

[[lean_lib]]
name = "MultiplicativeBasisDeformations"
globs = ["MultiplicativeBasisDeformations", "MultiplicativeBasisDeformations.*"]
weakLeanArgs = ["-j1", "-M14000"]

[[lean_lib]]
name = "MBDVendor"
globs = ["MBDVendor.+"]
moreLeanArgs = ["-Dbackward.isDefEq.respectTransparency.types=false"]
weakLeanArgs = ["-j1", "-M14000"]

[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]
weakLeanArgs = ["-j1", "-M14000"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]
weakLeanArgs = ["-j1", "-M14000"]
